<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suscripción</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2328;
      padding: 16px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p  { margin: 0 0 24px; color: #57606a; }
    #success { display: none; color: #1a7f37; font-weight: 600; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Suscríbete</h1>
    <p>Completa tu suscripción de forma segura con PayPal.</p>

    <div id="paypal-button-container-P-13L688748Y9834155NLU7NGA"></div>
    <div id="success"></div>
  </div>

  <script src="https://www.paypal.com/sdk/js?client-id=Ac_rexNSlMHxGTtzt3_LnLydvrB5IEQpVAfY4TjUBUhJFLwbuR4mAt-yJMZGn8bmoEglfDzE6N0COqMZ&vault=true&intent=subscription" data-sdk-integration-source="button-factory"></script>
  <script>
    paypal.Buttons({
      style: {
        shape: 'rect',
        color: 'gold',
        layout: 'vertical',
        label: 'subscribe'
      },
      createSubscription: function (data, actions) {
        return actions.subscription.create({
          plan_id: 'P-13L688748Y9834155NLU7NGA'
        });
      },
      onApprove: function (data, actions) {
        alert(data.subscriptionID);
        var ok = document.getElementById('success');
        ok.textContent = '¡Gracias! Tu suscripción está activa. ID: ' + data.subscriptionID;
        ok.style.display = 'block';
      }
    }).render('#paypal-button-container-P-13L688748Y9834155NLU7NGA');
  </script>
</body>
</html>
